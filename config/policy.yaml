# Controls enforced by code (validators + Poster). Never by prompts.
# Amounts are strings so they load as Decimal.

materiality:
  abs: "50.00"        # differences below this are auto-accepted and logged
  pct: "0.001"        # or below 0.1% of invoice total

tolerances:
  qty_pct: "0.00"
  price_pct: "0.005"

approval_limits:      # max invoice total each role may approve (USD equiv)
  approver: "100000.00"
  controller: "1000000.00"
  cfo: "100000000.00"
  cto: "100000000.00"         # same authority as the CFO

locked_periods:       # YYYY-MM; nothing posts into these
  - "2026-08"
  - "2026-09"

fx_rates:             # SIMULATED fixed table, to USD
  USD: "1"
  TWD: "0.031"
  KRW: "0.00073"
  MYR: "0.21"

accounts:
  ap_control: "Liabilities:AP"
  expense_default: "Expenses:COGS:Materials"
  freight: "Expenses:Freight"

skills:               # event type -> skill (Router reads this; documents never choose)
  three_way_match: "ap-3way-match"
  bank_change: "vendor-bank-change"

sla:                  # approvals waiting on a human (simulated clock)
  approval_hours: 24          # reminder at due_at
  escalate_after_hours: 48    # then route to backup approver (still != requester, within limit)
  payment_at_risk_days: 2     # flag when the invoice due date is this close and still not approved

probation:            # new vendors (CLAUDE.md 10d step 7)
  days: 90
  invoices: 5
  qty_pct: "0"
  price_pct: "0"              # tighter than tolerances above
  pay_after_first_delivery: true

queue:                # priority = weights . features (A computes; higher = sooner)
  due_soon_days: 5
  weight_due: 3
  weight_amount: 2
  weight_discount: 2
  weight_critical: 2

metrics:              # ESTIMATES, labeled as such in the UI
  minutes_saved_clean: 6
  minutes_saved_exception: 45

onboarding:           # vendor onboarding from a Slack contract (CLAUDE.md 10d)
  auto_approve_low_risk: true   # every check passed -> approved by policy, no human click; else a controller decides

release:              # tiered maker-checker at payment release
  roles: [controller, cfo, cto]   # AP leads approve but never release; an AP-lead approval goes up one level
