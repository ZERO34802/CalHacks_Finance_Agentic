# Slack app manifest for the ReconAI bot (Socket Mode: no public URL needed).
# api.slack.com/apps -> Create New App -> From a manifest -> paste this.
# Then: Basic Information -> App-Level Tokens -> generate one with `connections:write` -> SLACK_APP_TOKEN (xapp-...)
#       OAuth & Permissions -> Install to Workspace -> Bot User OAuth Token -> SLACK_BOT_TOKEN (xoxb-...)
# Invite the bot to the negotiation channel: /invite @ReconAI
display_information:
  name: ReconAI
  description: Helix Silicon AP agent - negotiation coach, contract drafting and vendor onboarding
  background_color: "#0e6e76"
features:
  bot_user:
    display_name: ReconAI
    always_online: true
  slash_commands:
    - command: /reconai
      description: negotiate <vendor> | status | contract | onboard | stop
      usage_hint: negotiate Acme Probe Cards
      should_escape: false
oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - channels:history
      - groups:history
      - mpim:history
      - im:history
      - chat:write
      - commands
      - files:write
      - users:read
      - users:read.email
settings:
  event_subscriptions:
    bot_events:
      - app_mention
      - message.channels
      - message.groups
      - message.mpim
  interactivity:
    is_enabled: true
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
