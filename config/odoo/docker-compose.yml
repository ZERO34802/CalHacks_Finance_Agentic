# Helix ERP: Odoo 17 Community (free, open source) for the buyer side. `make erp` starts it on http://localhost:8069
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
      POSTGRES_DB: postgres
    volumes: [odoo-db:/var/lib/postgresql/data]
    restart: unless-stopped
  odoo:
    image: odoo:17
    depends_on: [db]
    ports: ["8069:8069"]
    environment:
      HOST: db
      USER: odoo
      PASSWORD: odoo
    volumes: [odoo-data:/var/lib/odoo]
    restart: unless-stopped
volumes:
  odoo-db:
  odoo-data:
